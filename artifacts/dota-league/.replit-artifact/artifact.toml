kind = "web"
previewPath = "/"
title = "Dota League Tracker"
version = "1.0.0"
id = "artifacts/dota-league"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22442

[services.development]
run = "pnpm --filter @workspace/dota-league run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dota-league", "run", "build" ]
serve = "static"
publicDir = "artifacts/dota-league/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22442"
BASE_PATH = "/"
